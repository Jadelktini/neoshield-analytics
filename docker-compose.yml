version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: neoshield_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-neoshield_fraud}
      POSTGRES_USER: ${DB_USER:-analyst_user}
      POSTGRES_PASSWORD: ${DB_PASS:-FintechSecurePassword2026}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01_init.sql
      - ./database/functions/hybrid_rules.sql:/docker-entrypoint-initdb.d/02_hybrid_rules.sql

volumes:
  postgres_data: